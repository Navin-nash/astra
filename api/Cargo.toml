[package]
name = "astra-api"
version = "0.1.0"
edition = "2021"

[lib]
name = "astra_api"
path = "src/lib.rs"

[[bin]]
name = "astra-api"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = [
    "cors",
    "trace",
    "compression-gzip",
    "request-id",
] }

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }

# Cache
redis = { version = "0.26", features = ["tokio-comp", "tokio-rustls-comp", "connection-manager"] }

# HTTP client (replaces async-openai — avoids upstream deserialization quirks)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth (JWT validation only — issuance handled by Next.js)
jsonwebtoken = "9"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
futures = "0.3"
dashmap = "6"

# AST parsing
tree-sitter = "0.22"
tree-sitter-javascript = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-python = "0.21"
tree-sitter-rust = "0.21"
tree-sitter-go = "0.21"
sha2 = "0.11.0"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
tower = { version = "0.4", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
